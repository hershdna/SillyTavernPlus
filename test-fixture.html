<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SillyTavernPlus fixture</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { color: #eee; background: #202124; font: 14px sans-serif; padding: 20px; }
    .alternate_grettings { max-width: 850px; }
    .alternate_greetings_list { display: flex; flex-direction: column; gap: 8px; }
    .alternate_greeting { border: 1px solid #555; padding: 8px; }
    summary { cursor: pointer; }
    .title_restorable { display: flex; align-items: center; gap: 8px; }
    .expander { flex: 1; }
    textarea { display: block; width: 100%; min-height: 80px; margin-top: 8px; }
    button, input { font: inherit; }
    #top-settings-holder { display: flex; gap: 8px; min-height: 42px; }
    .drawer { display: flex; align-items: center; }
    .drawer-icon { font-size: 28px; padding: 3px; }
    .closedDrawer { display: none; }
    .openDrawer { display: block; }
    #WorldInfo { width: 520px; height: 360px; background: #303238; padding: 12px; }
    #wiActivationSettings { max-width: 520px; margin: 14px 0; padding: 10px; border: 1px solid #555; }
  </style>
</head>
<body>
  <div id="top-settings-holder">
    <div id="fixture-native-icon" class="drawer">
      <div class="drawer-toggle drawer-header"><div class="drawer-icon fa-solid fa-sliders fa-fw closedIcon" title="Native icon"></div></div>
    </div>
  </div>
  <section id="wiActivationSettings">
    <strong>Global World Info/Lorebook activation settings</strong>
    <div id="wiCheckboxes"></div>
  </section>
  <output id="fixture-reasoning-prompt" hidden></output>
  <div id="WI-SP-button" class="drawer">
    <div id="WIDrawerIcon" class="drawer-icon fa-solid fa-book-atlas fa-fw closedIcon" title="World Info"></div>
    <div id="WorldInfo" class="drawer-content closedDrawer">
      <div id="WorldInfoheader" class="fa-solid fa-grip drag-grabber"></div>
      <div class="flex-container alignitemscenter gap10px"><h3>Worlds/Lorebooks</h3></div>
      <div id="world_popup_entries_list">Native World Info editor content</div>
    </div>
  </div>
  <div class="alternate_grettings">
    <h2>Alternate Greetings</h2>
    <div class="alternate_greetings_list">
      <div class="alternate_greeting" data-index="0">
        <details open><summary><div class="title_restorable"><strong>Alternate Greeting #<span class="greeting_index">1</span></strong><span class="expander"></span></div></summary><textarea class="alternate_greeting_text">Greeting one</textarea></details>
      </div>
      <div class="alternate_greeting" data-index="1">
        <details open><summary><div class="title_restorable"><strong>Alternate Greeting #<span class="greeting_index">2</span></strong><span class="expander"></span></div></summary><textarea class="alternate_greeting_text">Greeting two</textarea></details>
      </div>
      <div class="alternate_greeting" data-index="2">
        <details open><summary><div class="title_restorable"><strong>Alternate Greeting #<span class="greeting_index">3</span></strong><span class="expander"></span></div></summary><textarea class="alternate_greeting_text">Greeting three</textarea></details>
      </div>
    </div>
  </div>
  <script>
    const fixtureExtensionSettings = {};
    const fixtureEventHandlers = new Map();
    window.SillyTavern = {
      getContext() {
        return {
          extensionSettings: fixtureExtensionSettings,
          saveSettingsDebounced() {},
          chat: [
            { is_user: true, mes: 'User message' },
            { is_user: false, mes: 'Earlier assistant response', extra: { reasoning: 'The assistant considered the old stone tower.' } },
            { is_user: false, mes: 'Assistant response', extra: { reasoning: 'The assistant considered a moonlit forest.' } },
          ],
          setExtensionPrompt(id, value, position, depth, scan) {
            const output = document.getElementById('fixture-reasoning-prompt');
            output.dataset.id = id;
            output.dataset.position = String(position);
            output.dataset.depth = String(depth);
            output.dataset.scan = String(scan);
            output.textContent = value;
          },
          eventSource: {
            on(event, handler) {
              fixtureEventHandlers.set(event, handler);
            },
          },
          eventTypes: { GENERATION_STARTED: 'generation_started' },
        };
      },
    };
    document.getElementById('WIDrawerIcon').addEventListener('click', () => {
      const panel = document.getElementById('WorldInfo');
      panel.classList.toggle('openDrawer');
      panel.classList.toggle('closedDrawer');
    });
  </script>
  <script src="index.js"></script>
</body>
</html>
